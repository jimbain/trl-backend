services:
  trl_backend_app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - ${APP_PORT}:${APP_PORT}
    depends_on:
      - trl_db
      - trl_redis
    networks:
      - trl-net

  trl_db:
    image: postgres:16
    environment:
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_DATABASE}"
    volumes:
      - trl-pgsql:/var/lib/postgresql/data
    ports:
      - ${FORWARD_DB_PORT}:5432
    networks:
      - trl-net

  trl_redis:
    image: redis:7
    restart: always
    ports:
      - "${FORWARD_REDIS_PORT}:${REDIS_PORT}"
    networks:
      - trl-net
    volumes:
      - trl-redis:/data

networks:
  trl-net:
    external: true

volumes:
  trl-pgsql:
    driver: local
  trl-redis:
    driver: local
