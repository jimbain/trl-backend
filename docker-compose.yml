services:
  trl_backend_app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - ${APP_PORT}:${APP_PORT}
    environment:
      - DB_HOST=trl_db
      - DB_PORT=5432
      - DB_USER=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_DATABASE}
      - REDIS_HOST=trl_redis
      - REDIS_PORT=6379
    depends_on:
      - trl_db
      - trl_redis
    networks:
      - trl-net

  trl_db:
    image: postgres:16
    environment:
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
      POSTGRES_DB: '${DB_DATABASE}'
    volumes:
      - trl-pgsql:/var/lib/postgresql/data
    ports:
      - ${FORWARD_DB_PORT}:5432
    networks:
      - trl-net

  trl_redis:
    image: redis:7
    restart: always
    ports:
      - "${FORWARD_REDIS_PORT}:${REDIS_PORT}"
    networks:
      - trl-net
    volumes:
      - trl-redis:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}

networks:
  trl-net:
    external: true

volumes:
  trl-pgsql:
    driver: local
  trl-redis:
    driver: local
