services:
  trl_backend_app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - 8900:${APP_PORT}
    depends_on:
      - trl_db
    networks:
      - trl-net

  trl_db:
    image: postgres:16
    environment:
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_DATABASE}"
    volumes:
      - trl-pgsql:/var/lib/postgresql/data
    ports:
      - ${FORWARD_DB_PORT}:5432
    networks:
      - trl-net

networks:
  trl-net:

volumes:
  trl-pgsql:
    driver: local
