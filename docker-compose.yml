services:
  trl_backend_app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - ${APP_PORT}:${APP_PORT}
    environment:
      - DB_HOST=trl_db
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - REDIS_HOST=trl_redis
      - REDIS_PORT=6379
    depends_on:
      trl_db:
        condition: service_healthy
      trl_redis:
        condition: service_started
    networks:
      - trl-net

  trl_db:
    image: postgres:16
    environment:
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
      POSTGRES_DB: '${DB_DATABASE}'
    volumes:
      - trl-pgsql:/var/lib/postgresql/data
    ports:
      - ${FORWARD_DB_PORT}:5432
    networks:
      - trl-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  trl_redis:
    image: redis:7
    restart: always
    ports:
      - "${FORWARD_REDIS_PORT}:${REDIS_PORT}"
    networks:
      - trl-net
    volumes:
      - trl-redis:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}

networks:
  trl-net:
    driver: bridge

volumes:
  trl-pgsql:
    driver: local
  trl-redis:
    driver: local
